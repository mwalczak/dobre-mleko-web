name: Build and deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
  # Weekly rebuild (Mondays 03:37 UTC) to pick up base image and Alpine security fixes
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Unique per run, so a scheduled rebuild of the same commit still rolls out
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_number }}
    steps:
      # The schedule rebuilds the latest commit on main: only if CI passed on it (as a push-triggered deploy).
      - name: Check CI passed on this commit
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --limit 1 \
            --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "::error::CI on $SHA is '${conclusion:-missing}': not rebuilding"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Render manifests
        env:
          WEB_HOST: ${{ vars.WEB_HOST }}
        run: |
          sed -e "s|IMAGE_PLACEHOLDER|${IMAGE}:${TAG}|" -e "s|HOST_PLACEHOLDER|${WEB_HOST}|g" k8s.yaml > rendered.yaml

      - name: Deploy to k3s
        run: |
          ssh debian@${{ secrets.VPS_HOST }} \
            'KUBECONFIG=$HOME/.kube/config kubectl apply -f - && KUBECONFIG=$HOME/.kube/config kubectl -n dobre-mleko rollout status deployment/web --timeout=120s' \
            < rendered.yaml
